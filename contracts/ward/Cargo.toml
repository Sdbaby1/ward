[package]
name = "ward"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Counterparty blocklist and treasury for agents that pay on NEAR."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.14.0"

[dev-dependencies]
near-sdk = { version = "5.14.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
